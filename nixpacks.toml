providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@9.15.0 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @quiver/sdk build",
  "pnpm --filter @quiver/api build",
  "pnpm --filter @quiver/web build",
]

[start]
cmd = "node scripts/start-railway.mjs"
