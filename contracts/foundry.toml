[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "empty", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "empty", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
